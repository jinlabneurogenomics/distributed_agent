[project]
name = "distributed_agents"
version = "0.0.0"
description = "Agent runtime for evidence-grounded perturbation biology analysis"
readme = "src/distributed_agents/README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "networkx>=3.2,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "httpx>=0.27,<1",
    "openai>=1.50",
    "openai-agents>=0.17.3",
]
build = [
    "httpx>=0.27,<1",
    "openai>=1.50",
    "openai-agents>=0.0.10",
]
analysis = [
    "pyarrow>=15",
]

[project.scripts]
distributed_agents = "distributed_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["distributed_agents*"]
exclude = [
    "distributed_agents.skills.gene-annotation-skill*",
    "distributed_agents.corpus.releases*",
]

[tool.setuptools.package-data]
distributed_agents = [
    "corpus/README.md",
    "corpus/current_release.json",
    "corpus/project_session_capabilities.json",
    "corpus/overlays/*.md",
    "corpus/schemas/*.json",
    "build/prompts/**/*.md",
    "build/schemas/**/*.json",
    "query/prompts/*.md",
    "skills/SKILLS_INDEX.md",
    "skills/runtime/**/*.md",
    "skills/runtime/**/*.py",
    "skills/runtime/**/*.json",
    "skills/runtime/**/*.txt",
    "skills/runtime/**/*.yaml",
    "skills/dataset/**/*.md",
    "skills/dataset/**/*.py",
    "skills/dataset/**/*.json",
    "skills/dataset/**/*.txt",
    "skills/dataset/**/*.yaml",
    "skills/life-sciences/**/*.md",
    "skills/life-sciences/**/*.py",
    "skills/life-sciences/**/*.json",
    "skills/life-sciences/**/*.txt",
    "skills/life-sciences/**/*.yaml",
]

# This is intentionally the smallest environment needed to build and exercise
# the core wheel. Runtime-specific dependencies remain in project extras.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.13"

[tool.pixi.pypi-dependencies]
distributed_agents = { path = ".", editable = true }
build = ">=1.2,<2"
setuptools = ">=68,<85"
wheel = ">=0.43,<1"

[tool.pixi.tasks]
wheel = "python -m build --wheel --no-isolation --outdir dist"
smoke-wheel = { cmd = "python scripts/smoke_wheel.py", depends-on = ["wheel"] }
bioeval = { cmd = "python -m bioeval", env = { PYTHONPATH = "src" } }

[tool.pixi.environments]
minimal = { solve-group = "minimal" }
