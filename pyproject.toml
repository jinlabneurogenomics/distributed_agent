[project]
name = "distributed_agents"
version = "0.0.0"
description = "Agent runtime for evidence-grounded perturbation biology analysis"
readme = "src/distributed_agents/README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "networkx>=3.2,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "httpx>=0.27,<1",
    "openai>=1.50",
    "openai-agents>=0.17.3",
]
build = [
    "httpx>=0.27,<1",
    "openai>=1.50",
    "openai-agents>=0.0.10",
]
analysis = [
    "pyarrow>=15",
]
manuscript = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scipy>=1.12,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "beautifulsoup4>=4.12,<5",
    "adjustText>=1.3,<2",
    "openpyxl>=3.1,<4",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[project.scripts]
distributed_agents = "distributed_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["distributed_agents*", "manuscript_figures*"]
exclude = [
    "distributed_agents.skills.gene-annotation-skill*",
    "distributed_agents.corpus.releases*",
]

[tool.setuptools.package-data]
manuscript_figures = ["style.mplstyle"]
distributed_agents = [
    "corpus/README.md",
    "corpus/current_release.json",
    "corpus/project_session_capabilities.json",
    "corpus/overlays/*.md",
    "corpus/schemas/*.json",
    "build/prompts/**/*.md",
    "build/schemas/**/*.json",
    "query/prompts/*.md",
    "skills/SKILLS_INDEX.md",
    "skills/runtime/**/*.md",
    "skills/runtime/**/*.py",
    "skills/runtime/**/*.json",
    "skills/runtime/**/*.txt",
    "skills/runtime/**/*.yaml",
    "skills/dataset/**/*.md",
    "skills/dataset/**/*.py",
    "skills/dataset/**/*.json",
    "skills/dataset/**/*.txt",
    "skills/dataset/**/*.yaml",
    "skills/life-sciences/**/*.md",
    "skills/life-sciences/**/*.py",
    "skills/life-sciences/**/*.json",
    "skills/life-sciences/**/*.txt",
    "skills/life-sciences/**/*.yaml",
]

# The minimal environment contains the core runtime. The default environment
# adds the manuscript analysis and notebook dependencies.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.13"

[tool.pixi.pypi-dependencies]
distributed_agents = { path = ".", editable = true }
build = ">=1.2,<2"
setuptools = ">=68,<85"
wheel = ">=0.43,<1"

[tool.pixi.tasks]
wheel = "python -m build --wheel --no-isolation --outdir dist"
smoke-wheel = { cmd = "python scripts/smoke_wheel.py", depends-on = ["wheel"] }
bioeval = { cmd = "python -m bioeval", env = { PYTHONPATH = "src" } }
prepare-manuscript = "python -m manuscript_figures.prepare"
notebook = "jupyter lab notebook/"

[tool.pixi.feature.manuscript.pypi-dependencies]
distributed_agents = { path = ".", editable = true, extras = ["manuscript"] }

[tool.pixi.environments]
default = { features = ["manuscript"], solve-group = "manuscript" }
minimal = { solve-group = "minimal" }
